<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accesso — Manuale SAP WM | Biofarma Group</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sap-shell:   #354a5e;
      --sap-panel:   #f7f7f7;
      --sap-card:    #ffffff;
      --sap-hover:   #e8f0fe;
      --sap-border:  #d9d9d9;
      --sap-text:    #32363a;
      --sap-muted:   #6a6d70;
      --sap-faint:   #ababab;
      --sap-accent:  #0070f2;
      --sap-blue:    #0070f2;
      --sap-blue-d:  #0040b0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--sap-panel);
      color: var(--sap-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .bg-grid {
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(53,74,94,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(53,74,94,0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }
    .bg-glow {
      position: fixed; width: 600px; height: 600px; border-radius: 50%;
      background: radial-gradient(circle, rgba(0,112,242,0.07) 0%, transparent 70%);
      top: -200px; left: -150px; z-index: 0;
    }
    .bg-glow-2 {
      position: fixed; width: 400px; height: 400px; border-radius: 50%;
      background: radial-gradient(circle, rgba(53,74,94,0.06) 0%, transparent 70%);
      bottom: -100px; right: -100px; z-index: 0;
    }

    .wrapper {
      position: relative; z-index: 1;
      width: 100%; max-width: 480px;
      padding: 24px;
      text-align: center;
    }

    .brand {
      margin-bottom: 40px;
    }
    .brand-icon {
      display: inline-flex;
      align-items: center; justify-content: center;
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--sap-blue), var(--sap-blue-d));
      border-radius: 14px;
      font-size: 26px; font-weight: 700; color: #fff;
      box-shadow: 0 4px 20px rgba(0,112,242,0.4);
      margin-bottom: 14px;
    }
    .brand-name {
      font-size: 22px; font-weight: 700;
      color: var(--sap-text); letter-spacing: -0.3px;
    }
    .brand-name span { color: var(--sap-blue); }
    .brand-sub {
      font-size: 13px; color: var(--sap-muted);
      margin-top: 4px; letter-spacing: 0.4px;
    }

    .card {
      background: var(--sap-card);
      border: 1px solid var(--sap-border);
      border-radius: 20px;
      padding: 44px 40px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08), 0 1px 0 rgba(255,255,255,0.8) inset;
    }

    .card-title {
      font-size: 18px; font-weight: 600;
      color: var(--sap-text);
      margin-bottom: 8px;
    }
    .card-sub {
      font-size: 13px; color: var(--sap-muted);
      margin-bottom: 36px;
    }

    .role-buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn-role {
      display: flex;
      align-items: center;
      gap: 18px;
      width: 100%;
      padding: 20px 24px;
      border: 1.5px solid var(--sap-border);
      border-radius: 14px;
      background: var(--sap-card);
      color: var(--sap-text);
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      font-size: 15px;
    }
    .btn-role:hover {
      background: var(--sap-hover);
      border-color: var(--sap-blue);
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(0,112,242,0.15);
    }
    .btn-role:active { transform: translateY(0); }

    .btn-role.admin:hover { border-color: #0070f2; box-shadow: 0 6px 24px rgba(0,112,242,0.15); }

    .role-icon {
      width: 48px; height: 48px; flex-shrink: 0;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .btn-role.utente .role-icon  { background: rgba(0,112,242,0.15); }
    .btn-role.admin  .role-icon  { background: rgba(64,180,229,0.15); }

    .role-info { flex: 1; }
    .role-label {
      font-size: 16px; font-weight: 600;
      color: var(--sap-text);
      margin-bottom: 3px;
    }
    .role-desc {
      font-size: 12px; color: var(--sap-muted);
    }

    .role-arrow {
      color: var(--sap-faint);
      font-size: 18px;
      transition: transform 0.2s, color 0.2s;
    }
    .btn-role:hover .role-arrow { transform: translateX(4px); color: var(--sap-blue); }

    /* ── Checkbox "Resta connesso" ── */
    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 20px 0 4px;
      font-size: 13px;
      color: var(--sap-muted);
      cursor: pointer;
      user-select: none;
    }
    .remember-row input[type="checkbox"] {
      width: 16px; height: 16px;
      accent-color: var(--sap-blue);
      cursor: pointer;
      flex-shrink: 0;
    }

    .error-msg {
      display: none;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.25);
      color: #c00;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-top: 20px;
      text-align: center;
    }
    .error-msg.show { display: block; }

    .powered {
      margin-top: 24px;
      font-size: 11px;
      color: var(--sap-faint);
    }
    .powered span { color: var(--sap-muted); }

    /* ═══════════════════════════════════════════════
       MOBILE RESPONSIVE  ≤ 768px
    ═══════════════════════════════════════════════ */
    @media (max-width: 768px) {
      body { overflow-y: auto; }
      .wrapper { padding: 16px; max-width: 100%; }
      .brand { margin-bottom: 24px; }
      .brand-icon { width: 48px; height: 48px; font-size: 22px; border-radius: 12px; }
      .brand-name { font-size: 19px; }
      .card { padding: 28px 20px; border-radius: 14px; }
      .btn-role { padding: 14px 16px; gap: 12px; }
      .role-icon { width: 40px; height: 40px; font-size: 18px; border-radius: 10px; }
      .role-label { font-size: 14px; }
      .role-desc { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="bg-glow-2"></div>

  <div class="wrapper">
    <div class="brand">
      <div class="brand-icon">B</div>
      <div class="brand-name"><span>Biofarma</span> Group</div>
      <div class="brand-sub">Manuale Utente Interattivo — SAP WM</div>
    </div>

    <div class="card">
      <div class="card-title">Scegli il tuo profilo</div>
      <div class="card-sub">Seleziona come vuoi accedere al portale</div>

      <div class="role-buttons">
        <button class="btn-role utente" onclick="accedi('user')">
          <div class="role-icon">👤</div>
          <div class="role-info">
            <div class="role-label">Utente</div>
            <div class="role-desc">Accedi al manuale SAP WM e al tuo progresso</div>
          </div>
          <span class="role-arrow">›</span>
        </button>

        <button class="btn-role admin" onclick="accedi('admin')">
          <div class="role-icon">⚙️</div>
          <div class="role-info">
            <div class="role-label">Amministratore</div>
            <div class="role-desc">Gestisci utenti, statistiche e contenuti</div>
          </div>
          <span class="role-arrow">›</span>
        </button>
      </div>

      <label class="remember-row">
        <input type="checkbox" id="rememberMe"> Resta connesso
      </label>

      <div class="error-msg" id="errorMsg"></div>
    </div>

    <div class="powered">Powered by <span>SAP WM</span> · Biofarma Group © 2026</div>
  </div>

  <script>
    const API = '/api';

    // Redirect se già loggato (controlla localStorage e sessionStorage)
    const savedToken = localStorage.getItem('bf_token') || sessionStorage.getItem('bf_token');
    if (savedToken) {
      try {
        const p = JSON.parse(atob(savedToken.split('.')[1]));
        if (p.exp * 1000 > Date.now()) {
          window.location.href = p.ruolo === 'admin' ? '/admin' : '/manuale';
        }
      } catch {}
    }

    async function accedi(ruolo) {
      const errEl = document.getElementById('errorMsg');
      errEl.classList.remove('show');

      try {
        const res = await fetch(`${API}/auth/bypass`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ruolo })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Errore di accesso');

        const rememberMe = document.getElementById('rememberMe').checked;
        if (rememberMe) {
          // Resta connesso: salva in localStorage (persiste alla chiusura del browser)
          localStorage.setItem('bf_token', data.token);
          localStorage.setItem('bf_user', JSON.stringify(data.user));
        } else {
          // Sessione singola: salva in sessionStorage (si cancella alla chiusura)
          sessionStorage.setItem('bf_token', data.token);
          sessionStorage.setItem('bf_user', JSON.stringify(data.user));
        }

        window.location.href = ruolo === 'admin' ? '/admin' : '/manuale';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.add('show');
      }
    }
  </script>
</body>
</html>
